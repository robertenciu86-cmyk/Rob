name: Build Brendan Comedy Group

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly, so London's Eventbrite refreshes (and any edits) show up here soon after.
    - cron: "47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Brendan layer
        uses: actions/checkout@v6

      - name: Check out the London site
        uses: actions/checkout@v6
        with:
          repository: robertenciu86-cmyk/robertenciu86-cmyk.github.io
          path: london

      - name: Build the bizarro site
        run: python3 bizarro.py london _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub pauses scheduled workflows after 60 days without a commit.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%FT%TZ > heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "Keep mirror schedule alive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
